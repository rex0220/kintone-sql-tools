name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Prepare plugin signing key
        if: ${{ secrets.KSQL_PLUGIN_ID != '' && secrets.KSQL_PLUGIN_PPK_BASE64 != '' }}
        run: echo "${{ secrets.KSQL_PLUGIN_PPK_BASE64 }}" | base64 -d > private.ci.ppk

      - name: Build plugin (signed)
        if: ${{ secrets.KSQL_PLUGIN_ID != '' && secrets.KSQL_PLUGIN_PPK_BASE64 != '' }}
        env:
          KSQL_PLUGIN_ID: ${{ secrets.KSQL_PLUGIN_ID }}
          KSQL_PPK_PATH: private.ci.ppk
        run: npm run build:plugin

      - name: Skip plugin build (missing secrets)
        if: ${{ !(secrets.KSQL_PLUGIN_ID != '' && secrets.KSQL_PLUGIN_PPK_BASE64 != '') }}
        run: echo "Skipping signed plugin build (KSQL_PLUGIN_ID / KSQL_PLUGIN_PPK_BASE64 not set)."

      - name: Build CLI
        run: npm run build:cli
